# Configuration file

runed_wood {

    ##########################################################################################################
    # acacia
    #--------------------------------------------------------------------------------------------------------#
    # Configurations for the replacement wood for the Acacia runed pillar (note that the same configuration CAN be used for multiple runed pillars
    ##########################################################################################################

    acacia {
        # The blockstate that defines the capstone of the runed pillar (i.e, 'roots:runed_acacia'
        S:capstone=roots:runed_acacia

        # The itemstack that defines the pillar of the runed pillar (i.e., 'minecraft:log:2'
        S:item=thebetweenlands:log_nibbletwig

        # The blockstate that defines the pillar of the runed pillar (i.e., 'minecraft:log[variant=birch]'
        S:pillar=thebetweenlands:log_nibbletwig
