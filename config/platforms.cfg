            thebetweenlands:mud_bricks_carved:11
            thebetweenlands:mud_bricks_carved:12
            thebetweenlands:mud_bricks_carved:13
         >

        # Listed blocks will be used in addition to any registered as 'plankWood'
        S:woodBlocks <
            thebetweenlands:log_weedwood
            thebetweenlands:log_weedwood:12
            thebetweenlands:log_rotten_bark
