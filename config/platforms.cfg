# Configuration file

general {
    # Changes what sneak right-clicking on a platform with a wrench will do
    # GUI: opens the platform selector GUI
    # CYCLE: cycles through the options
    # MIXED: uses the GUI if the is more then 5 options
    # Valid values:
    # GUI
    # CYCLE
    # MIXED
    S:platformSelect=MIXED

    ##########################################################################################################
    # additional_blocks
    #--------------------------------------------------------------------------------------------------------#
    # By default Wood and Stone Platforms only use blocks registered to the Forge Ore Dictionary but additional blocks can be added here.
    # 
    # Format = §9modId§r:§2nameId§3@meta
    # §9modId§r can be left off for vanilla blocks, and 'ore' can be used to indicate a dictionary entry
    # §2nameId§r can contain [*] or [#-#] to replace an incrementing number or a number range
    # §3@meta§r can be left off to indicate any meta
    ##########################################################################################################

    additional_blocks {
        # Listed blocks will be used in addition to any registered as 'stone', 'cobblestone', or 'sandstone'
        S:stoneBlocks <
            thebetweenlands:betweenstone_bricks
            thebetweenlands:cragrock
            thebetweenlands:cragrock:2
            thebetweenlands:cragrock:1
            thebetweenlands:pitstone
            thebetweenlands:limestone
            thebetweenlands:betweenstone_bricks_mirage
            thebetweenlands:betweenstone_tiles
            thebetweenlands:betweenstone_chiseled
            thebetweenlands:cragrock_chiseled
            thebetweenlands:limestone_chiseled
            thebetweenlands:pitstone_chiseled
            thebetweenlands:cracked_betweenstone_bricks
            thebetweenlands:cracked_betweenstone_tiles
            thebetweenlands:cracked_limestone_bricks
            thebetweenlands:cragrock_bricks
            thebetweenlands:cragrock_tiles
            thebetweenlands:limestone_bricks
            thebetweenlands:limestone_tiles
            thebetweenlands:mossy_betweenstone_bricks
            thebetweenlands:mossy_betweenstone_tiles
            thebetweenlands:mossy_limestone_bricks
            thebetweenlands:mossy_smooth_betweenstone
            thebetweenlands:mud_bricks
            thebetweenlands:mud_brick_shingles
            thebetweenlands:pitstone_bricks
            thebetweenlands:pitstone_tiles
            thebetweenlands:polished_limestone
            thebetweenlands:smooth_betweenstone
            thebetweenlands:smooth_cragrock
            thebetweenlands:smooth_pitstone
            thebetweenlands:worm_dungeon_pillar
            thebetweenlands:worm_dungeon_pillar:1
            thebetweenlands:worm_dungeon_pillar:2
            thebetweenlands:worm_dungeon_pillar:3
            thebetweenlands:worm_dungeon_pillar:4
            thebetweenlands:worm_dungeon_pillar:6
            thebetweenlands:worm_dungeon_pillar:7
            thebetweenlands:worm_dungeon_pillar:8
